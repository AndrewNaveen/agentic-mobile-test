<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1250" viewBox="0 0 1600 1250" role="img" aria-labelledby="title description">
<title id="title">Explorer components and ownership</title>
<desc id="description">The pytest entry point validates a brief, creates an Appium driver and wires one ExplorationLoop. The loop coordinates observer, planner, policy, executor and an independently budgeted final review gateway. Observer and executor share AppiumActions. Gemini returns decisions; Appium drives the app. The loop saves evidence throughout the run.</desc>
