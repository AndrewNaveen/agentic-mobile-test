<text x="85" y="1893" font-size="20" font-weight="400" fill="#52657A" text-anchor="start">Handled observation, provider or execution errors also end the loop and preserve available evidence.</text>
<text x="60" y="2190" font-size="20" font-weight="400" fill="#52657A" text-anchor="start">Every attempt is saved. Final review assesses the evidence; it never restarts exploration or proves product correctness.</text>
