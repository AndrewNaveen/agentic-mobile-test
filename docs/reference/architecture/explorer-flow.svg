<text x="62" y="111" font-size="38" font-weight="700" fill="#FFFFFF" text-anchor="start">How an exploration runs</text>
<text x="62" y="145" font-size="21" font-weight="400" fill="#C4D3E2" text-anchor="start">Read downward. Return paths reuse the same step, call and cost limits.</text>
