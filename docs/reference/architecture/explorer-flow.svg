<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2220" viewBox="0 0 1600 2220" role="img" aria-labelledby="title description">
<title id="title">Explorer runtime flow</title>
<desc id="description">After explicit opt-in and brief/device validation, capture the initial screen. While limits allow, the planner requests a Gemini decision and saves the proposal. Notes are recorded without device actions; UI actions pass ActionPolicy before Appium execution and a new observation. Rejections are saved and refreshed; three consecutive rejected actions or invalid/duplicate notes stop the loop. Finish, guidance, budget exhaustion or errors preserve the exploration outcome. Final review is attempted only with captured screen evidence, using a separate budget. Reports are saved even if review is unavailable, and there is no automatic restart.</desc>
<defs>
